kind = "web"
previewPath = "/"
title = "CityPulse"
description = "An India-first civic issue reporting and resolution platform connecting citizens, municipal operators, and field officers through AI-assisted triage and transparent workflows."
version = "1.0.0"
id = "artifacts/citypulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21414

[services.development]
run = "pnpm --filter @workspace/citypulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/citypulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/citypulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21414"
BASE_PATH = "/"

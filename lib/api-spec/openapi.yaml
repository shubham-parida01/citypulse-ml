openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CityPulse civic incident platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: incidents
    description: Citizen incident reporting and tracking
  - name: operator
    description: Municipal operator review and routing
  - name: officer
    description: Field officer assignments and resolution
  - name: analytics
    description: Municipal dashboard analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/incidents:
    get:
      operationId: listMyIncidents
      tags: [incidents]
      summary: List the current citizen's incidents
      responses:
        "200":
          description: Citizen incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Create a civic incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /v1/incidents/{incidentId}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get an incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
  /v1/incidents/{incidentId}/verify:
    post:
      operationId: verifyIncident
      tags: [incidents]
      summary: Confirm or reject a resolution
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "200":
          description: Verification recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentStatusResult"
  /v1/admin/incidents:
    get:
      operationId: listAdminIncidents
      tags: [operator]
      summary: List incidents for the operator queue
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/IncidentCategory"
        - in: query
          name: priority
          schema:
            $ref: "#/components/schemas/Priority"
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Operator incident queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
  /v1/admin/incidents/{incidentId}:
    get:
      operationId: getAdminIncident
      tags: [operator]
      summary: Get full operator incident detail
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Operator incident detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
  /v1/admin/incidents/{incidentId}/category:
    patch:
      operationId: overrideIncidentCategory
      tags: [operator]
      summary: Override the AI category
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryOverrideInput"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /v1/admin/incidents/{incidentId}/priority:
    patch:
      operationId: overrideIncidentPriority
      tags: [operator]
      summary: Override operational priority
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriorityOverrideInput"
      responses:
        "200":
          description: Priority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /v1/admin/incidents/{incidentId}/assign:
    post:
      operationId: assignIncident
      tags: [operator]
      summary: Manually route an incident to a municipal team
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "200":
          description: Incident assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /v1/officer/incidents:
    get:
      operationId: listOfficerIncidents
      tags: [officer]
      summary: List field officer assignments
      responses:
        "200":
          description: Field assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
  /v1/incidents/{incidentId}/start:
    post:
      operationId: startIncidentWork
      tags: [officer]
      summary: Start work on an assigned incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Work started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentStatusResult"
  /v1/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get municipal dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
  /v1/analytics/categories:
    get:
      operationId: getAnalyticsCategories
      tags: [analytics]
      summary: Get incident counts by category
      responses:
        "200":
          description: Category counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: number }
components:
  parameters:
    IncidentId:
      in: path
      name: incidentId
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IncidentCategory:
      type: string
      enum: [POTHOLE, WATERLOGGING, GARBAGE, ILLEGAL_DUMPING, BROKEN_STREETLIGHT, SEWAGE_OVERFLOW, DAMAGED_SIDEWALK, FALLEN_TREE, OTHER]
    IncidentStatus:
      type: string
      enum: [SUBMITTED, AI_ANALYSIS, AWAITING_REVIEW, MANUAL_REVIEW, ASSIGNED, IN_PROGRESS, RESOLVED, CITIZEN_VERIFICATION, CLOSED, REOPENED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        accuracy: { type: number }
    AiAnalysis:
      type: object
      required: [category, confidence, severity, severityLabel, modelVersion]
      properties:
        category: { $ref: "#/components/schemas/IncidentCategory" }
        confidence: { type: number }
        severity: { type: number }
        severityLabel: { type: string }
        modelVersion: { type: string }
        detectedFeatures:
          type: array
          items: { type: string }
    Assignment:
      type: object
      properties:
        department: { type: string }
        division: { type: string }
        team: { type: string }
        assignedAt: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [status, at]
      properties:
        status: { $ref: "#/components/schemas/IncidentStatus" }
        at: { type: string, format: date-time }
        note: { type: string }
    Incident:
      type: object
      required: [incidentId, category, status, priority, severity, location, reportedAt]
      properties:
        incidentId: { type: string }
        category: { $ref: "#/components/schemas/IncidentCategory" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        severity: { type: number }
        aiConfidence: { type: number }
        description: { type: string }
        location: { $ref: "#/components/schemas/Location" }
        reportedAt: { type: string, format: date-time }
        latestUpdate: { type: string }
        department: { type: string }
        division: { type: string }
        team: { type: string }
        imageUrl: { type: string }
    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          properties:
            aiAnalysis: { $ref: "#/components/schemas/AiAnalysis" }
            assignment: { $ref: "#/components/schemas/Assignment" }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }
            resolutionImageUrl: { type: string }
    IncidentInput:
      type: object
      required: [imageUrl, latitude, longitude]
      properties:
        imageUrl: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        accuracy: { type: number }
        description: { type: string }
        category: { $ref: "#/components/schemas/IncidentCategory" }
    CategoryOverrideInput:
      type: object
      required: [category, reason]
      properties:
        category: { $ref: "#/components/schemas/IncidentCategory" }
        reason: { type: string }
    PriorityOverrideInput:
      type: object
      required: [priority, reason]
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        reason: { type: string }
    AssignmentInput:
      type: object
      required: [department, division, team]
      properties:
        department: { type: string }
        division: { type: string }
        team: { type: string }
        notes: { type: string }
    VerificationInput:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [CONFIRMED, REJECTED]
    IncidentStatusResult:
      type: object
      required: [incidentId, status]
      properties:
        incidentId: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        updatedAt: { type: string, format: date-time }
    AnalyticsOverview:
      type: object
      required: [totalIncidents, openIncidents, criticalIncidents, overdueIncidents, avgResolutionHours]
      properties:
        totalIncidents: { type: number }
        openIncidents: { type: number }
        criticalIncidents: { type: number }
        overdueIncidents: { type: number }
        avgResolutionHours: { type: number }

